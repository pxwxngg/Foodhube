<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Foodhube - Checkout</title>

    <link rel="stylesheet" href="checkout.css">

</head>

<body>

    <!-- HEADER -->

    <header>

        <h2>Foodhube</h2>

        <nav>

            <a href="index.html">Home</a>

            <a href="menu.html">Menu</a>

            <a href="cart.html">🛒 Cart</a>

        </nav>

    </header>


    <!-- CHECKOUT -->

    <section class="checkout">

        <h1>Checkout</h1>


        <div class="checkout-container">


            <!-- CUSTOMER DETAILS -->

            <div class="customer-details">

                <h2>Delivery Details</h2>


                <form id="checkoutForm">


                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >


                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter phone number"
                        required
                    >


                    <label for="address">
                        Address
                    </label>

                    <textarea
                        id="address"
                        placeholder="Enter your full address"
                        required
                    ></textarea>


                    <label for="city">
                        City
                    </label>

                    <input
                        type="text"
                        id="city"
                        placeholder="Enter your city"
                        required
                    >


                    <h3>Payment Method</h3>


                    <div class="payment">

                        <input
                            type="radio"
                            id="cod"
                            name="payment"
                            value="Cash on Delivery"
                            checked
                        >

                        <label for="cod">
                            💵 Cash on Delivery
                        </label>

                    </div>


                    <button
                        type="submit"
                        class="place-order-btn">

                        Place Order

                    </button>


                </form>

            </div>


            <!-- ORDER SUMMARY -->

            <div class="order-summary">

                <h2>Your Order</h2>

                <div id="orderItems"></div>


                <div class="total">

                    Total:

                    ₹<span id="orderTotal">
                        0
                    </span>

                </div>

            </div>


        </div>

    </section>


    <script src="checkout.js"></script>

</body>

</html>
