<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Foodhube - Menu</title>

    <!-- CSS -->
    <link rel="stylesheet" href="menu.css">

</head>


<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header>

        <h2>Foodhube</h2>

        <nav>

            <a href="index.html">Home</a>

            <a href="menu.html">Menu</a>

            <a href="cart.html">🛒 Cart</a>

        </nav>

    </header>   


    <!-- =========================
         MENU
    ========================== -->

    <section class="menu">

        <h1>Our Menu 🍽️</h1>

        <p>Choose your favourite food</p>


        <!-- SEARCH -->

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search food..."
                oninput="searchFood()">

        </div>


        <!-- CATEGORIES -->

        <div class="categories">

            <button
                class="category-btn active"
                onclick="filterFood('All', this)">
                All
            </button>

            <button
                class="category-btn"
                onclick="filterFood('Pizza', this)">
                🍕 Pizza
            </button>

            <button
                class="category-btn"
                onclick="filterFood('Biryani', this)">
                🍗 Biryani
            </button>

            <button
                class="category-btn"
                onclick="filterFood('Burger', this)">
                🍔 Burger
            </button>

            <button
                class="category-btn"
                onclick="filterFood('Starter', this)">
                🥘 Starter
            </button>

            <button
                class="category-btn"
                onclick="filterFood('Sides', this)">
                🍟 Sides
            </button>

        </div>


        <!-- LOADING -->

        <p id="loading">
            Loading foods...
        </p>


        <!-- ERROR -->

        <p id="error"></p>


        <!-- FOOD CARDS -->

        <div
            class="food-container"
            id="foodContainer">
        </div>


        <!-- NO FOOD -->

        <p id="noFood">
            No food found 😔
        </p>

    </section>


    <!-- JavaScript -->

    <script src="menu.js"></script>

</body>

</html>
